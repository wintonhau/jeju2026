                }

                expandableHtml = `
                    <div id="card-content-${item.id}" class="hidden px-5 pb-4 pt-2 bg-gray-50/60 border-t border-gray-100 flex-col gap-2.5">
                        <div class="text-sm text-gray-700 space-y-2 mt-1">
                            ${innerHtml}
                        </div>
                    </div>
                `;
            }

            return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 mb-3.5 overflow-hidden transition-all duration-300 hover:shadow-md relative group">
                    <div class="absolute left-0 top-0 bottom-0 w-1 bg-[#0047A0]"></div>
                    
                    <div class="p-3.5 pl-5 flex justify-between items-center gap-2 ${hasExpandableContent ? 'cursor-pointer' : ''}" 
                         ${hasExpandableContent ? `onclick="toggleCard(${item.id})"` : ''}>
                        <div class="flex flex-col min-w-0 flex-1 pr-1">
                            <span class="text-xs font-bold text-[#CD2E3A] tracking-wider mb-0.5">
                                ${item.time}
                            </span>
                            <h3 class="text-base font-bold text-gray-800 leading-tight truncate">
                                ${item.title}
                            </h3>
                        </div>
                        
                        <div class="flex items-center gap-1 flex-shrink-0">
                            ${actionsHtml}
                        </div>
                    </div>
                    ${expandableHtml}
                </div>
            `;
        }

        function renderMain() {
            const mainContainer = document.getElementById('main-content');
            mainContainer.innerHTML = availableDates.map(date => {
                const accommodationNav = ACCOMMODATION_NAV[date];
                let headerNavHtml = '';
                
                if (accommodationNav) {
                    headerNavHtml += `
                        <a href="${accommodationNav.naver}" target="_blank" rel="noopener noreferrer" class="px-3 py-1 bg-gray-100 text-gray-700 border border-gray-200 text-xs rounded-lg font-bold shadow-2xs hover:bg-gray-200 transition-colors flex items-center gap-1 active:scale-95">
                            <span>${accommodationNav.label}</span>🧭
                        </a>
                    `;
                }

                const cardsHtml = groupedData[date].map(item => generateCardHTML(item)).join('');

                return `
                    <section id="date-section-${date}" class="scroll-mt-36">
                        <div class="flex justify-between items-center mb-4 sticky top-[133.5px] z-20 py-3.5 bg-[#F8FAFC]/95 backdrop-blur-sm border-b border-gray-200/60">
                            <h2 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                                <span>📅</span> ${formatDateDisplay(date)}
                            </h2>
                            <div class="flex items-center gap-2">
                                <a href="https://www.kma.go.kr/neng/index.do" target="_blank" rel="noopener noreferrer" class="px-3 py-1 bg-gray-100 text-gray-700 border border-gray-200 text-xs rounded-lg font-bold shadow-2xs hover:bg-gray-200 transition-colors flex items-center gap-1 active:scale-95">
                                    <span>天氣</span>⛅
                                </a>
                                ${headerNavHtml}
                            </div>
                        </div>
                        <div class="space-y-3">
                            ${cardsHtml}
                        </div>
                    </section>
                `;
            }).join('');
        }

        // Scroll spy event listener
        window.addEventListener('scroll', () => {
            if (isManualScrolling) return;
            
            const scrollPosition = window.scrollY + 200; // Offset for fixed headers
            let currentActiveDate = availableDates[0];

            for (const date of availableDates) {
                const element = document.getElementById(`date-section-${date}`);
                if (element && element.offsetTop <= scrollPosition) {
                    currentActiveDate = date;
                }
            }

            if (currentActiveDate !== selectedDate) {
                selectedDate = currentActiveDate;
                renderNav();
            }
        });

        // PDF Modal logic
        function closePdf() {
            const root = document.getElementById('modal-root');
            root.classList.add('hidden');
            root.innerHTML = '';
        }

        function openPdf(pdfId) {
            const details = VOUCHER_DETAILS[pdfId];
            if (!details) return;

            let innerContent = '';

            if (details.type === 'hotel') {
                innerContent = `
                    <div class="border-b pb-3 border-gray-100">
                        <span class="inline-block px-2.5 py-1 bg-blue-50 text-blue-700 font-bold rounded-md text-xs mb-1">🏨 飯店入住憑證 (Hotel Voucher)</span>
                        <h4 class="font-extrabold text-base text-gray-900">${details.hotelName}</h4>
                        <p class="text-gray-500 mt-1">📍 ${details.address}</p>
                        <p class="text-gray-500">📞 ${details.phone}</p>
                    </div>
                    <div class="grid grid-cols-2 gap-3 bg-gray-50 p-3.5 rounded-xl border border-gray-100">
                        <div><p class="text-gray-400 font-medium text-xs">入住旅客 (Guest)</p><p class="font-bold text-gray-800 mt-0.5">${details.guestName}</p></div>
                        <div><p class="text-gray-400 font-medium text-xs">可入住人數</p><p class="font-bold text-gray-800 mt-0.5">${details.capacity}</p></div>
                        <div><p class="text-gray-400 font-medium text-xs">確認編號 (Confirmation No.)</p><p class="font-bold text-blue-600 mt-0.5 tracking-wider">${details.confirmNo}</p></div>
                        <div><p class="text-gray-400 font-medium text-xs">PIN 碼 (PIN Code)</p><p class="font-bold text-red-600 mt-0.5 tracking-wider">${details.pinCode}</p></div>
                    </div>
                    <div class="space-y-2 bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <p><strong>入住時間：</strong>${details.checkIn}</p>
                        <p><strong>退房時間：</strong>${details.checkOut}</p>
                        <p><strong>房型：</strong>${details.roomType}</p>
                        <p><strong>餐點服務：</strong>${details.meals}</p>
                        <p><strong>付款詳情：</strong>${details.price}</p>
                    </div>
                    <div class="bg-amber-50/80 p-3 rounded-xl border border-amber-200/80 text-amber-900 text-sm">
                        <p class="font-bold mb-1">⚠️ 取消政策與條款：</p>
                        <p class="leading-relaxed">${details.cancellation}</p>
                    </div>
                `;
            } else if (details.type === 'airbnb') {
                innerContent = `
                    <div class="border-b pb-3 border-gray-100">
                        <span class="inline-block px-2.5 py-1 bg-rose-50 text-rose-700 font-bold rounded-md text-xs mb-1">🛖 Airbnb 民宿預約憑證 (Airbnb Receipt)</span>
                        <h4 class="font-extrabold text-base text-gray-900">${details.propertyName}</h4>
                        <p class="text-gray-500 mt-1">📍 ${details.address}</p>
                        <p class="text-gray-500 mt-0.5">👤 房東 (Host)：${details.host}</p>
                    </div>
                    <div class="grid grid-cols-2 gap-3 bg-gray-50 p-3.5 rounded-xl border border-gray-100">
                        <div><p class="text-gray-400 font-medium text-xs">確認代碼 (Confirmation Code)</p><p class="font-bold text-rose-600 mt-0.5 tracking-wider">${details.confirmNo}</p></div>
                        <div><p class="text-gray-400 font-medium text-xs">入住人數</p><p class="font-bold text-gray-800 mt-0.5">${details.capacity}</p></div>
                    </div>
                    <div class="space-y-2 bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <p><strong>入住時間：</strong>${details.checkIn}</p>
                        <p><strong>退房時間：</strong>${details.checkOut}</p>
                        <p><strong>總費用：</strong><span class="font-bold text-rose-600">${details.price}</span></p>
                        <p><strong>付款記錄：</strong>${details.paymentDetails}</p>
                    </div>
                    <div class="bg-amber-50/80 p-3 rounded-xl border border-amber-200/80 text-amber-900 text-sm">
                        <p class="font-bold mb-1">🏡 房屋守則 (House Rules)：</p>
                        <p class="leading-relaxed">${details.houseRules}</p>
                    </div>
                    <div class="bg-sky-50 p-3 rounded-xl border border-sky-100 text-sky-900 text-sm">
                        <p class="font-bold mb-1">ℹ️ 取消政策 (Cancellation Policy)：</p>
                        <p class="leading-relaxed">${details.cancellation}</p>
                    </div>
                `;
            } else if (details.type === 'restaurant') {
                innerContent = `
                    <div class="border-b pb-3 border-gray-100">
                        <span class="inline-block px-2.5 py-1 bg-orange-50 text-orange-700 font-bold rounded-md text-xs mb-1">🍽️ 餐廳預約憑證 (Dining Reservation)</span>
                        <h4 class="font-extrabold text-base text-gray-900">${details.restaurantName}</h4>
                        ${details.address ? `<p class="text-gray-500 mt-1">📍 ${details.address}</p>` : ''}
                        ${details.phone ? `<p class="text-gray-500">📞 ${details.phone}</p>` : ''}
                    </div>
                    <div class="grid grid-cols-2 gap-3 bg-gray-50 p-3.5 rounded-xl border border-gray-100">
                        <div><p class="text-gray-400 font-medium text-xs">預約人 (Guest)</p><p class="font-bold text-gray-800 mt-0.5">${details.guestName}</p></div>
                        <div><p class="text-gray-400 font-medium text-xs">人數 (Party Size)</p><p class="font-bold text-gray-800 mt-0.5">${details.capacity}</p></div>
                        ${details.resNo ? `<div><p class="text-gray-400 font-medium text-xs">預約單號 (Reservation No.)</p><p class="font-bold text-blue-600 mt-0.5 tracking-wider">${details.resNo}</p></div>` : ''}
                        ${details.status ? `<div><p class="text-gray-400 font-medium text-xs">狀態 (Status)</p><p class="font-bold text-emerald-600 mt-0.5">${details.status}</p></div>` : ''}
                    </div>
                    <div class="space-y-2 bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <p><strong>預約日期：</strong>${details.date}</p>
                        <p><strong>預約時間：</strong>${details.time}</p>
                        ${details.price ? `<p><strong>付款總額：</strong><span class="font-bold text-orange-600">${details.price}</span></p>` : ''}
                    </div>
                    ${details.note ? `
                    <div class="bg-amber-50/80 p-3 rounded-xl border border-amber-200/80 text-amber-900 text-sm">
                        <p class="font-bold mb-1">ℹ️ 預約注意事項：</p>
                        <p class="leading-relaxed">${details.note}</p>
                    </div>` : ''}
                `;
            } else {
                innerContent = `
                    <div class="border-b pb-3 border-gray-100">
                        <span class="inline-block px-2.5 py-1 bg-red-50 text-red-700 font-bold rounded-md text-xs mb-1">🚗 租車預約憑證 (Car Rental Confirmation)</span>
                        <h4 class="font-extrabold text-base text-gray-900">${details.provider} - ${details.location}</h4>
                        <p class="text-gray-500 mt-1">📍 ${details.address}</p>
                        <p class="text-gray-500">📞 ${details.phone}</p>
                    </div>
                    <div class="grid grid-cols-2 gap-3 bg-gray-50 p-3.5 rounded-xl border border-gray-100">
                        <div><p class="text-gray-400 font-medium text-xs">主要駕駛員 (Primary Driver)</p><p class="font-bold text-gray-800 mt-0.5">${details.driverName}</p></div>
                        <div><p class="text-gray-400 font-medium text-xs">預約單號 (Reservation No.)</p><p class="font-bold text-blue-600 mt-0.5 tracking-wider">${details.resNo}</p></div>
                        <div><p class="text-gray-400 font-medium text-xs">租用車型 (Car Model)</p><p class="font-bold text-gray-800 mt-0.5">${details.carModel}</p></div>
                        <div><p class="text-gray-400 font-medium text-xs">保險方案 (Insurance)</p><p class="font-bold text-emerald-600 mt-0.5">${details.insurance}</p></div>
                    </div>
                    <div class="space-y-2 bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <p><strong>取車時間：</strong>${details.pickupTime}</p>
                        <p><strong>還車時間：</strong>${details.returnTime}</p>
                        <p><strong>總支付金額：</strong><span class="font-bold text-red-600">${details.totalPayment}</span></p>
                    </div>
                    <div class="bg-sky-50 p-3 rounded-xl border border-sky-100 text-sky-900">
                        <p class="font-bold mb-1">🚌 機場接駁車搭乘指引 (Shuttle Bus)：</p>
                        <p class="leading-relaxed">${details.shuttle}</p>
                    </div>
                    <div class="bg-amber-50/80 p-3 rounded-xl border border-amber-200/80 text-amber-900 text-sm">
                        <p class="font-bold mb-1">📋 取車當天必須攜帶文件：</p>
                        <p class="whitespace-pre-line leading-relaxed">${details.requirements}</p>
                    </div>
                `;
            }

            const modalHtml = `
                <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-gray-200 flex flex-col" onclick="event.stopPropagation()">
                    <div class="p-4 bg-slate-900 text-white flex justify-between items-center sticky top-0 z-10">
                        <div class="flex items-center gap-2">
                            <span class="text-xl">📄</span>
                            <div>
                                <h3 class="font-bold text-base leading-tight">${details.title}</h3>
                                <p class="text-sm text-slate-300 font-medium">${details.provider} 官方電子確認檔憑證</p>
                            </div>
                        </div>
                        <button onclick="closePdf()" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition-colors">✕</button>
                    </div>
                    <div class="p-5 space-y-4 text-sm text-gray-800">
                        ${innerContent}
                    </div>
                </div>
            `;

            const root = document.getElementById('modal-root');
            root.innerHTML = modalHtml;
            root.classList.remove('hidden');
            
            // Close modal when clicking outside
            root.onclick = closePdf;
        }

        // Initialize App on DOM Load
        document.addEventListener('DOMContentLoaded', () => {
            renderNav();
            renderMain();
        });

    </script>
</body>
</html>
